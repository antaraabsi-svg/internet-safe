<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إنترنت آمن، جيل واعٍ — ديوان قطاع الشباب والرياضة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --navy:#0E1B5C; --royal:#1F45C9; --violet:#6A35C9; --gold:#E4B03A; --orange:#FF7A1F;
  --green:#0C7B3E; --red:#D0243F;
  --bg:#EEF0FF; --panel:#FFFFFF; --ink:#111A44; --muted:#4B5486; --line:#D6DBF6; --soft:#F4F5FF;
  --okbg:#E4F5EA; --midbg:#FFF1DE; --badbg:#FDE5E9;
  --f-display:'Lalezar','Tajawal','Segoe UI',Tahoma,sans-serif;
  --f-body:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1240; --panel:#141F66; --ink:#EEF0FF; --muted:#BAC1F0; --line:#2C3B96; --soft:#1A2878;
    --okbg:#0F3B27; --midbg:#4A3413; --badbg:#4B1A2A;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1240; --panel:#141F66; --ink:#EEF0FF; --muted:#BAC1F0; --line:#2C3B96; --soft:#1A2878;
  --okbg:#0F3B27; --midbg:#4A3413; --badbg:#4B1A2A;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);font-size:100%}
html.stage{font-size:125%}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);line-height:1.75;min-height:100vh;-webkit-text-size-adjust:100%}
button{font-family:inherit;font-size:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

/* flag stripe: green | white with a thin red line */
.stripe{height:8px;background:linear-gradient(90deg,var(--green) 0 50%,#fff 50% 96%,var(--red) 96% 100%)}

/* header */
.top{background:linear-gradient(135deg,var(--navy),#1a2f9a 60%,var(--violet));color:#fff;padding:.7rem 1rem}
.top-in{max-width:980px;margin:auto;display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.top img{width:56px;height:56px;border-radius:50%;border:2px solid var(--gold);background:#fff;flex:none}
.top h1{font-family:var(--f-display);font-weight:400;font-size:1.35rem;margin:0;line-height:1.2;letter-spacing:0}
.top small{display:block;font-size:.8rem;opacity:.85}
.tools{margin-inline-start:auto;display:flex;gap:.4rem;flex-wrap:wrap}
.tbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:.3rem .85rem;font-size:.85rem}
.tbtn:hover{background:rgba(255,255,255,.22)}
.tbtn[aria-pressed="true"]{background:var(--gold);color:var(--navy);border-color:var(--gold)}

/* route track */
.track-wrap{background:var(--navy);padding:.9rem 1rem 1rem;overflow-x:auto}
.track{max-width:980px;margin:auto;display:flex;align-items:flex-start;min-width:900px;position:relative}
.node{flex:1;display:flex;flex-direction:column;align-items:center;gap:.25rem;background:none;border:0;color:#B9C1F5;position:relative;padding:0 .1rem;font-size:.75rem;line-height:1.3}
.node .dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:1.05rem;background:#1b2a80;border:2px solid #3A4BB0;position:relative;z-index:2;transition:transform .2s}
.node::before{content:"";position:absolute;top:19px;inset-inline:-50% 50%;height:4px;background:#2c3b96;z-index:1}
.node:first-child::before{display:none}
.node.done::before,.node.cur::before{background:var(--gold)}
.node.done .dot{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.node.cur{color:#fff;font-weight:700}
.node.cur .dot{background:#fff;border-color:var(--gold);box-shadow:0 0 0 4px rgba(228,176,58,.45);transform:scale(1.12)}

/* main */
main{max-width:980px;margin:1.2rem auto 2rem;padding:0 1rem}
.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:1.4rem 1.5rem 1.2rem;position:relative;overflow:hidden}
.card::after{content:"";position:absolute;inset-inline-start:0;top:0;width:8px;height:100%;background:linear-gradient(var(--gold),var(--orange) 55%,var(--violet))}
h2{font-family:var(--f-display);font-weight:400;font-size:1.9rem;line-height:1.3;margin:.1rem 0 .3rem;color:var(--royal)}
:root[data-theme="dark"] h2{color:#AFC0FF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) h2{color:#AFC0FF}}
.lead{color:var(--muted);margin:0 0 1rem;max-width:62ch}
.ctx{font-weight:700;margin:.4rem 0}
.bubble{background:var(--soft);border:2px solid var(--line);border-radius:18px 18px 18px 4px;padding:.9rem 1.1rem;margin:.4rem 0 1rem;max-width:64ch;position:relative}
.bubble::before{content:"مجهول";position:absolute;top:-.85rem;inset-inline-start:.9rem;background:var(--violet);color:#fff;font-size:.72rem;padding:0 .6rem;border-radius:999px;line-height:1.6}
.opts{display:grid;gap:.6rem;max-width:720px}
.opt{text-align:start;background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:.75rem 1rem;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--royal);background:var(--soft)}
.opt:disabled{cursor:default}
.opt.dim{opacity:.55}
.opt.pick.s2,.opt.right{border-color:var(--green);background:var(--okbg)}
.opt.pick.s1{border-color:var(--orange);background:var(--midbg)}
.opt.pick.s0,.opt.wrong{border-color:var(--red);background:var(--badbg)}
.fb{border-radius:14px;padding:.7rem 1rem;margin:1rem 0 .5rem;max-width:720px;border:2px solid}
.fb p{margin:.15rem 0 0}
.fb.s2{background:var(--okbg);border-color:var(--green)}
.fb.s1{background:var(--midbg);border-color:var(--orange)}
.fb.s0{background:var(--badbg);border-color:var(--red)}
.best{font-size:.92rem;color:var(--muted);margin-top:.35rem}
.rule{display:flex;gap:.7rem;align-items:flex-start;background:var(--soft);border-radius:14px;padding:.7rem 1rem;margin:.9rem 0 .2rem;max-width:720px;border-inline-start:6px solid var(--gold)}
.rule b{color:var(--royal)}
:root[data-theme="dark"] .rule b{color:#AFC0FF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .rule b{color:#AFC0FF}}

.btn{border:0;border-radius:14px;padding:.65rem 1.3rem;font-weight:700;background:var(--gold);color:var(--navy)}
.btn:hover{background:#f0c14f}
.btn.sec{background:transparent;color:var(--royal);border:2px solid var(--royal)}
:root[data-theme="dark"] .btn.sec{color:#AFC0FF;border-color:#AFC0FF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.sec{color:#AFC0FF;border-color:#AFC0FF}}
.btn:disabled{opacity:.4;cursor:not-allowed}
.nav{display:flex;justify-content:space-between;align-items:center;gap:.8rem;margin-top:1.4rem;padding-top:1rem;border-top:2px dashed var(--line)}
.score{font-weight:700;color:var(--muted)}
.score b{color:var(--orange);font-size:1.15rem}

/* intro */
.hero{display:grid;grid-template-columns:auto 1fr;gap:1.6rem;align-items:center}
.hero .seal{width:190px;height:190px;border-radius:50%;padding:6px;background:conic-gradient(var(--gold),var(--orange),var(--violet),var(--royal),var(--gold));display:grid;place-items:center}
.hero .seal img{width:100%;height:100%;border-radius:50%;background:#fff;display:block}
.hero h2{font-size:2.6rem;margin-bottom:.2rem}
.aud{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin:1rem 0;max-width:560px}
.aud button{background:var(--soft);color:var(--ink);border:2px solid var(--line);border-radius:16px;padding:.8rem 1rem;text-align:start}
.aud button b{display:block;font-size:1.1rem}
.aud button span{font-size:.85rem;color:var(--muted)}
.aud button[aria-pressed="true"]{border-color:var(--royal);background:var(--panel);box-shadow:0 0 0 3px rgba(31,69,201,.25)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.6rem 0 0}
.chip{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:.1rem .8rem;font-size:.85rem}

/* password */
.pwbox{display:flex;gap:.5rem;max-width:520px}
.pwbox input{flex:1;font:inherit;font-size:1.1rem;padding:.7rem 1rem;border:2px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);direction:ltr;text-align:left}
.meter{height:14px;border-radius:999px;background:var(--line);max-width:520px;margin:.8rem 0 .3rem;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--red);transition:width .25s,background .25s}
.crit{list-style:none;padding:0;margin:.6rem 0;display:grid;gap:.25rem}
.crit li::before{content:"○ ";color:var(--muted)}
.crit li.ok::before{content:"● ";color:var(--green)}
.crit li.ok{font-weight:700}
.warn{font-size:.88rem;color:var(--muted)}

/* sequence items */
.item{background:var(--soft);border:2px solid var(--line);border-radius:18px;padding:1rem 1.2rem;margin:.6rem 0 1rem;max-width:720px;font-size:1.08rem}
.item .cnt{font-size:.85rem;color:var(--muted);display:block;margin-bottom:.2rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap;max-width:720px}
.row .opt{flex:1;min-width:150px;text-align:center;font-weight:700}
.sum{text-align:center;padding:1.5rem 0}
.sum .big{font-family:var(--f-display);font-size:3.5rem;color:var(--orange);line-height:1.1}

/* balance */
.sl{display:grid;grid-template-columns:110px 1fr 60px;gap:.6rem;align-items:center;max-width:620px;margin:.3rem 0}
.sl input[type=range]{width:100%;accent-color:var(--royal)}
.bar{display:flex;height:34px;border-radius:12px;overflow:hidden;max-width:620px;margin:1rem 0 .4rem;border:2px solid var(--line)}
.bar div{display:grid;place-items:center;font-size:.72rem;color:#fff;white-space:nowrap;overflow:hidden;transition:flex .25s}
.legend{display:flex;flex-wrap:wrap;gap:.3rem .9rem;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:.8rem;height:.8rem;border-radius:3px;margin-inline-end:.3rem;vertical-align:middle}

/* end */
.pledge{list-style:none;padding:0;margin:.6rem 0 1rem;display:grid;gap:.4rem;max-width:640px}
.pledge label{display:flex;gap:.7rem;align-items:center;background:var(--soft);border:2px solid var(--line);border-radius:14px;padding:.55rem .9rem;cursor:pointer}
.pledge input{width:1.2rem;height:1.2rem;accent-color:var(--green)}
.pledge label:has(input:checked){border-color:var(--green);background:var(--okbg)}
.cert{border:3px solid var(--gold);border-radius:20px;padding:1.2rem 1.4rem;background:linear-gradient(135deg,var(--soft),var(--panel));display:flex;gap:1.2rem;align-items:center;max-width:720px;margin:1rem 0}
.cert img{width:92px;height:92px;border-radius:50%;border:3px solid var(--gold);background:#fff;flex:none}
.cert h3{font-family:var(--f-display);font-weight:400;font-size:1.6rem;margin:0;color:var(--royal)}
:root[data-theme="dark"] .cert h3{color:#AFC0FF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cert h3{color:#AFC0FF}}
.cert input{font:inherit;padding:.4rem .8rem;border:2px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);min-width:200px}
.help{background:var(--navy);color:#fff;border-radius:18px;padding:1rem 1.3rem;margin-top:1rem;max-width:720px}
.help b{color:var(--gold)}
.help ul{margin:.3rem 0 0;padding-inline-start:1.2rem}

footer{max-width:980px;margin:0 auto 2rem;padding:0 1rem;text-align:center;color:var(--muted);font-size:.88rem}
footer q{font-family:var(--f-display);font-size:1.15rem;color:var(--royal);quotes:"«" "»"}
:root[data-theme="dark"] footer q{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) footer q{color:var(--gold)}}


.info{background:var(--soft);border:2px solid var(--line);border-inline-start:6px solid var(--gold);border-radius:16px;padding:.6rem 1rem .9rem;margin:.6rem 0 1.1rem}
.info summary{cursor:pointer;font-weight:800;color:var(--royal);padding:.2rem 0}
:root[data-theme="dark"] .info summary{color:#AFC0FF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .info summary{color:#AFC0FF}}
.info .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:.9rem;margin-top:.5rem}
.info .pr{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:.6rem .9rem}
.info .pr b{color:var(--orange);display:block}
.info .pr p{margin:.15rem 0 0;font-size:.97rem}
.refs{font-size:.88rem;color:var(--muted);margin-top:1rem;max-width:720px}
.refs ul{margin:.3rem 0 0;padding-inline-start:1.2rem}
@media (max-width:760px){.info .cols{grid-template-columns:1fr}}
#printcert{display:none}
@media print{
  body>*:not(#printcert){display:none!important}
  #printcert{display:flex!important;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:95vh;border:10px double #E4B03A;padding:2rem;margin:0;color:#0E1B5C;background:#fff}
  #printcert img{width:150px;height:150px;border-radius:50%;border:4px solid #E4B03A}
  #printcert h1{font-family:var(--f-display);font-weight:400;font-size:3rem;margin:1rem 0 .3rem}
  #printcert .nm{font-size:2.2rem;font-weight:800;border-bottom:3px solid #E4B03A;padding:0 2rem;margin:.6rem 0}
  #printcert p{font-size:1.2rem;margin:.3rem 0}
  #printcert .g{color:#0C7B3E;font-weight:700}
}
@media (max-width:640px){
  .hero{grid-template-columns:1fr;justify-items:center;text-align:center}
  .hero .seal{width:150px;height:150px}
  .hero h2{font-size:2rem}
  .aud{grid-template-columns:1fr}
  .sl{grid-template-columns:90px 1fr 48px}
  .cert{flex-direction:column;text-align:center}
  .top h1{font-size:1.1rem}
  h2{font-size:1.6rem}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

function card(key){
  const c=CARDS[key],p=c[S.aud],open=S.cardOpen[key]!==false;
  return `<details class="info" data-card="${key}" ${open?'open':''}><summary>📖 بطاقة توعوية: ${c.t}</summary><div class="cols">${p.map((x,i)=>`<div class="pr"><b>${L[i]}</b><p>${x}</p></div>`).join('')}</div></details>`;
}

/* ---------- helpers ---------- */
function award(key,v){S.pts[key]=v;updScore()}
function updScore(){const e=$('#sc');if(e)e.textContent=sum()}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rule=(t,b)=>`<div class="rule"><span aria-hidden="true">💡</span><div><b>${b}</b> ${t}</div></div>`;

function scen(key,d){
  const a=S.ans[key];
  const best=d.opts.find(o=>o.s===2);
  let h=`<p class="ctx">${d.ctx}</p><div class="bubble">${d.msg}</div><div class="opts">`;
  d.opts.forEach((o,i)=>{
    h+=`<button class="opt ${a!==undefined?(i===a?'pick s'+o.s:'dim'):''}" data-act="pick" data-key="${key}" data-i="${i}" ${a!==undefined?'disabled':''}>${o.t}</button>`;
  });
  h+='</div>';
  if(a!==undefined){
    const o=d.opts[a];
    h+=`<div class="fb s${o.s}"><b>${['⚠️ انتبه','👍 قريب من الصواب','✅ أحسنت'][o.s]}</b><p>${o.f}</p>${o.s<2?`<p class="best">التصرف الأمثل: ${best.t}</p>`:''}</div>`;
    h+=`<button class="btn sec" data-act="retry" data-key="${key}">جرّب خيارًا آخر</button>`;
  }
  return h;
}
function seq(key){
  const items=SEQ[key].items(),btns=SEQ[key].btns;
  const q=S.q[key]||0,n=items.length,c=S.cor[key]||0;
  if(q>=n){
    const msg=c===n?'ممتاز! لم تخطئ ولا مرة.':c>=n-1?'رائع! أنت قريب من الإتقان.':'بداية جيدة. أعد المحاولة لتحسّن نتيجتك.';
    return `<div class="sum"><div class="big">${c} / ${n}</div><p>${msg}</p><button class="btn sec" data-act="redo" data-key="${key}">أعد المحاولة</button></div>`;
  }
  const it=items[q],a=S.ans[key+q];
  let h=`<div class="item"><span class="cnt">السؤال ${q+1} من ${n}</span>${it.t}</div><div class="row">`;
  btns.forEach((b,i)=>{
    let cls='';
    if(a!==undefined){cls=i===it.c?'right':(i===a?'wrong':'dim')}
    h+=`<button class="opt ${cls}" data-act="sans" data-key="${key}" data-b="${i}" ${a!==undefined?'disabled':''}>${b.t}</button>`;
  });
  h+='</div>';
  if(a!==undefined){
    const ok=a===it.c;
    h+=`<div class="fb ${ok?'s2':'s0'}"><b>${ok?'✅ إجابة صحيحة':'⚠️ ليس تمامًا'}</b><p>${it.f}</p></div><button class="btn" data-act="snext" data-key="${key}">${q+1<n?'التالي':'عرض النتيجة'}</button>`;
  }
  return h;
}

   `<div class="help" style="margin-top:1rem"><b>تذكّر:</b> الضحية لا تخطئ. المبتز هو المخطئ.<ul><li>الرقم الأخضر للطفولة: <b>1111</b> (مجاني، ليلًا ونهارًا)</li><li>الشرطة: <b>1548</b> · الدرك الوطني: <b>1055</b></li></ul></div>`;
 },
 news(){
  return H('المحطة الخامسة','خبر أم إشاعة؟','اقرأ البطاقة، ثم قرّر لكل خبر: تصدّقه وتنشره، أم تتوقف وتتحقق؟')+card('news')+seq('news')+
   rule('من نشره؟ متى؟ هل ذُكر المصدر؟ وهل أجد الخبر نفسه عند جهة رسمية أخرى؟','أسئلة التحقق الأربعة:');
 },
 bully(){
  return H('المحطة السادسة','أنا لست متفرجًا','التنمر الإلكتروني يؤذي حقًا. ماذا تفعل عندما تراه؟')+card('bully')+scen('bully',BULLY[S.aud])+
   rule('توقّف، لا ترد بانفعال · وثّق بلقطة شاشة · أبلغ المنصة واطلب مساعدة شخص بالغ موثوق.','ثلاث خطوات:');
 },
 fraud(){
  return H('المحطة السابعة','رسالة سليمة أم احتيال؟','اقرأ البطاقة، ثم صنّف كل رسالة أو عرض.')+card('fraud')+seq('fraud')+
   rule('هدية مفاجئة · استعجال · طلب كلمة سر أو بيانات بطاقة · رابط غريب · انتحال صفة جهة رسمية.','علامات الاحتيال:');
 },
 games(){
  return H('المحطة الثامنة','الألعاب والتحديات','اقرأ البطاقة، ثم احكم على كل تصرف: سليم أم خاطئ؟')+card('games')+seq('games');
 },
 law(){
  return H('المحطة التاسعة','ما أنشره يحاسبني','اقرأ البطاقة، ثم احكم على كل تصرف: سليم أم خاطئ؟')+card('law')+seq('law');
 },
 bal(){
  return H('المحطة العاشرة','توازن يومي','وزّع ساعات يومك النموذجي. الوقت الباقي للأكل والأهل والأصدقاء والراحة.')+card('bal')+`<div id="bl"></div>`;
 },
 end(){
  const p=sum(),pct=Math.round(p/TOTAL*100);
  const left=ST.slice(1,-1).filter(s=>S.pts[s.k]===undefined);
  const lvl=lvlOf(pct);
  return `<h2>الميثاق والنتيجة</h2>
  <p class="lead">نتيجتك: <b style="color:var(--orange);font-size:1.4rem">${p} / ${TOTAL}</b> — المستوى: <b>${lvl}</b></p>
  ${left.length?`<p>لم تكمل بعد: ${left.map(s=>`<button class="chip" data-act="go" data-i="${ST.indexOf(s)}">${s.ic} ${s.n}</button>`).join(' ')}</p>`:''}
  <p class="ctx">ميثاقي الرقمي — ضع علامة على ما تلتزم به:</p>
  <ul class="pledge">${PLEDGE.map((t,i)=>`<li><label><input type="checkbox" data-act="pl" data-i="${i}" ${S.pledge[i]?'checked':''}> ${t}</label></li>`).join('')}</ul>
  <div class="cert">
    <img src="${LOGO}" alt="">
    <div><h3>شهادة سفير الأمان الرقمي</h3>
    <p style="margin:.2rem 0"><label>الاسم: <input id="nm" placeholder="اكتب اسمك" maxlength="40"></label></p>
    <button class="btn" id="pr">طباعة الشهادة</button></div>
  </div>
  <div class="help"><b>أين أبلّغ وممن أطلب المساعدة؟</b> تحدث فورًا إلى شخص بالغ تثق به (أحد الوالدين، معلم، مربٍّ أو مسؤول دار الشباب).
   <ul><li>الرقم الأخضر للتبليغ عن المساس بحقوق الطفل (الهيئة الوطنية لحماية وترقية الطفولة): <b>1111</b>، مجاني ومفتوح على مدار الساعة</li><li>الشرطة: <b>1548</b> · الدرك الوطني: <b>1055</b></li></ul></div>
  <div class="refs"><b>مراجع الإلهام:</b> محتوى البطاقات والأسئلة مستوحى من الإرشادات والتحذيرات العلنية للجهات الرسمية الجزائرية. راجع صفحاتها الرسمية للاطلاع على آخر التنبيهات.
   <ul><li>بيان قيادة الدرك الوطني والمديرية العامة للأمن الوطني حول انتحال صفتهما في عمليات النصب الإلكتروني</li><li>الهيئة الوطنية لحماية وترقية الطفولة (onppe.dz)، الخط الأخضر 1111</li><li>دليل حماية الطفل على الإنترنت وموقع «الأسرة والطفل عبر الإنترنت بأمان» (وزارة البريد والمواصلات)</li><li>تصريحات مختصي الدرك الوطني حول الجرائم الإلكترونية</li></ul></div>`;
 }
};
function lvlOf(pct){return pct>=85?'سفير الأمان الرقمي':pct>=60?'حارس واعٍ':pct>=35?'مستكشف حذر':'متدرّب في بداية الطريق'}

/* ---------- rendering ---------- */
function drawTrack(){
  $('#track').innerHTML=ST.map((s,i)=>{
    const cls=i===S.i?'cur':(S.pts[s.k]!==undefined||(i<S.i&&S.visited[i]))?'done':'';
    return `<button class="node ${cls}" data-act="go" data-i="${i}" aria-label="${s.n}" ${i===S.i?'aria-current="step"':''}><span class="dot">${s.ic}</span><span>${s.n}</span></button>`;
  }).join('');
  const c=document.querySelector('.node.cur');
  if(c&&c.scrollIntoView)c.scrollIntoView({inline:'center',block:'nearest'});
}
function render(top){
  S.visited[S.i]=true;
  const k=ST[S.i].k;
  app.innerHTML=VIEW[k]()+`<div class="nav">
    <button class="btn sec" data-act="prev" ${S.i===0?'disabled':''}>السابق</button>
    <span class="score">النقاط: <b id="sc">${sum()}</b> / ${TOTAL}</span>
    <button class="btn" data-act="next" ${S.i===ST.length-1?'disabled':''}>${S.i===0?'ابدأ الرحلة':'التالي'}</button></div>`;
  drawTrack();
  if(k==='pass')initPass();
  if(k==='bal')drawBal();
  if(k==='end')initEnd();
  if(top)window.scrollTo({top:0,behavior:'smooth'});
}
function go(i){S.i=Math.max(0,Math.min(ST.length-1,i));render(true)}

function initPass(){
  const pw=$('#pw');
  const crit=[
   ['10 أحرف أو أكثر',v=>v.length>=10],
   ['تحتوي على أرقام',v=>/\d/.test(v)],
   ['تحتوي على رموز مثل ! _ - @',v=>/[^\p{L}\p{N}\s]/u.test(v)],
   ['أحرف كبيرة وصغيرة',v=>/[a-z]/.test(v)&&/[A-Z]/.test(v)],
   ['ليست كلمة شائعة (اسم فريق، 1962، 123456…)',v=>v.length>0&&!COMMON.some(c=>v.toLowerCase().includes(c))]
  ];
  function upd(){
    const v=pw.value;
    const r=crit.map(c=>c[1](v));
    const n=v?r.filter(Boolean).length:0;
    const strong=n>=4&&v.length>=10;
    $('#cr').innerHTML=crit.map((c,i)=>`<li class="${v&&r[i]?'ok':''}">${c[0]}</li>`).join('');
    const mi=$('#mi');
    mi.style.width=(n/5*100)+'%';
    mi.style.background=n<=1?'var(--red)':n<=3?'var(--orange)':'var(--green)';
    $('#mt').setAttribute('aria-valuenow',n);
    $('#ml').textContent=!v?'ابدأ بالكتابة…':strong?'قوية جدًا! هكذا تكون كلمة السر الجيدة.':n>=3?'جيدة، لكن يمكن أن تكون أقوى.':'ضعيفة: يسهل تخمينها.';
    if(v){award('pass',strong?3:n>=3?2:n>=1?1:0)}
  }
  pw.addEventListener('input',upd);
  $('#pwShow').addEventListener('click',e=>{
    const t=pw.type==='text';pw.type=t?'password':'text';
    e.target.textContent=t?'إظهار':'إخفاء';e.target.setAttribute('aria-pressed',t);
  });
  upd();
}

const BAL=[['sleep','النوم','#3d2b9c',0,12],['study','الدراسة/العمل','#1F45C9',0,12],['sport','الرياضة والنشاط','#0C7B3E',0,5],['screen','الشاشات للترفيه','#FF7A1F',0,10]];
function drawBal(){
  const fid=document.activeElement&&document.activeElement.id;
  const b=S.bal,used=b.sleep+b.study+b.sport+b.screen,rest=24-used;
  const minSleep=K()?9:8,maxScreen=K()?2:4;
  let h=BAL.map(x=>`<div class="sl"><label for="s_${x[0]}">${x[1]}</label><input type="range" id="s_${x[0]}" data-act="sl" data-k="${x[0]}" min="${x[3]}" max="${x[4]}" step="0.5" value="${b[x[0]]}"><b>${b[x[0]]} س</b></div>`).join('');
  h+=`<div class="bar" aria-hidden="true">${BAL.map(x=>`<div style="flex:${Math.max(b[x[0]],0.001)};background:${x[2]}">${b[x[0]]>=1.5?x[1].split('/')[0]:''}</div>`).join('')}<div style="flex:${Math.max(rest,0.001)};background:#6B7299">${rest>=2?'الباقي':''}</div></div>`;
  h+=`<div class="legend">${BAL.map(x=>`<span><i style="background:${x[2]}"></i>${x[1]}</span>`).join('')}<span><i style="background:#6B7299"></i>الباقي: ${Math.max(rest,0)} س (أكل، أهل، أصدقاء، راحة)</span></div>`;
  const chk=[
   [b.sleep>=minSleep,`النوم كاف (لا يقل عن ${minSleep} ساعات)`,`النوم قليل، الأفضل ${minSleep} ساعات على الأقل`],
   [b.sport>=1,'حركة يومية جيدة','حاول أن تمنح جسمك ساعة نشاط على الأقل'],
   [b.screen<=maxScreen,`الشاشات في حدود معقولة (حتى ${maxScreen} ساعات ترفيه)`,`وقت الشاشات كبير، حاول ألا يتجاوز ${maxScreen} ساعات`],
   [rest>=4&&used<=24,'وقت كاف للأهل والأصدقاء والأكل','لا يبقى وقت كاف للأهل والأصدقاء والراحة (الأقل 4 ساعات)']
  ];
  award('bal',chk.filter(c=>c[0]).length);
  h+=`<ul class="crit">${chk.map(c=>`<li class="${c[0]?'ok':''}">${c[0]?c[1]:c[2]}</li>`).join('')}</ul>`;
  h+=rule('هذه توصيات عامة للنقاش وليست وصفة طبية. الفكرة: الشاشة جزء من يومك وليست كل يومك.','ملاحظة:');
  $('#bl').innerHTML=h;
  updScore();
  if(fid){const e=document.getElementById(fid);if(e)e.focus()}
}

function initEnd(){
  const pr=$('#pr'),nm=$('#nm');
  pr.addEventListener('click',()=>{
    const p=sum(),pct=Math.round(p/TOTAL*100);
    $('#printcert').innerHTML=`<img src="${LOGO}" alt=""><h1>شهادة سفير الأمان الرقمي</h1>
      <p>يشهد ديوان قطاع الشباب والرياضة بأن</p><div class="nm">${esc(nm.value.trim()||'...........................')}</div>
      <p>شارك في الحصة التحسيسية «إنترنت آمن، جيل واعٍ» وحقق المستوى:</p><p class="g" style="font-size:1.8rem">${lvlOf(pct)}</p>
      <p>النتيجة: ${p} / ${TOTAL}</p><p style="margin-top:1.5rem">لنبني صروح الفكر، لا نكن معاول هدم</p>`;
    window.print();
  });
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,key=t.dataset.key;
  if(a==='next')go(S.i+1);
  else if(a==='prev')go(S.i-1);
  else if(a==='go')go(+t.dataset.i);
  else if(a==='aud'){const v=t.dataset.v;const pl=S.pledge;fresh();S.aud=v;S.pledge=pl;render()}
  else if(a==='pick'){
    const i=+t.dataset.i;S.ans[key]=i;
    award(key,SC[key][S.aud].opts[i].s);
    render();
  }
  else if(a==='retry'){delete S.ans[key];delete S.pts[key];render()}
  else if(a==='sans'){
    const q=S.q[key]||0,items=SEQ[key].items();
    const b=+t.dataset.b;S.ans[key+q]=b;
    if(b===items[q].c)S.cor[key]=(S.cor[key]||0)+1;
    award(key,S.cor[key]||0);render();
  }
  else if(a==='snext'){S.q[key]=(S.q[key]||0)+1;render()}
  else if(a==='redo'){
    Object.keys(S.ans).forEach(k=>{if(k.startsWith(key)&&k!==key)delete S.ans[k]});
    S.q[key]=0;S.cor[key]=0;award(key,0);render();
  }
});
document.addEventListener('toggle',e=>{
  const d=e.target;
  if(d&&d.dataset&&d.dataset.card)S.cardOpen[d.dataset.card]=d.open;
},true);
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.act==='sl'){S.bal[t.dataset.k]=+t.value;drawBal()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.act==='pl'){S.pledge[t.dataset.i]=t.checked}
});
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea')return;
  if(e.key==='ArrowLeft')go(S.i+1);
  if(e.key==='ArrowRight')go(S.i-1);
});
$('#bStage').addEventListener('click',e=>{
  const on=document.documentElement.classList.toggle('stage');
  e.target.setAttribute('aria-pressed',on);
  e.target.textContent=on?'إنهاء وضع العرض':'وضع العرض';
  try{if(on&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();else if(!on&&document.fullscreenElement)document.exitFullscreen()}catch(_){}
});
$('#bReset').addEventListener('click',()=>{fresh();render(true)});

render(false);
})();
</script>
